<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#97a1b2"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5b8cff"/>
    </marker>
  </defs>

  <!-- page background -->
  <rect x="0" y="0" width="1100" height="720" fill="#0b0d12"/>

  <!-- title -->
  <text x="40" y="44" fill="#e8eaf0" font-size="23" font-weight="bold">The modelling journey, ending in a simple-average ensemble</text>
  <text x="40" y="68" fill="#97a1b2" font-size="13">Each box shows its real headline number. English Jigsaw track. Two regimes are not directly comparable.</text>

  <!-- ===================== TOP: journey ===================== -->
  <text x="40" y="104" fill="#97a1b2" font-size="13" font-weight="bold">JOURNEY (left to right)</text>

  <!-- Stage 1: TF-IDF + LogReg (measured, green) -->
  <rect x="40" y="120" width="178" height="92" rx="10" fill="#161a23" stroke="#3ddc97" stroke-width="2"/>
  <text x="129" y="143" fill="#e8eaf0" font-size="13" font-weight="bold" text-anchor="middle">TF-IDF + LogReg</text>
  <text x="129" y="162" fill="#97a1b2" font-size="11" text-anchor="middle">bag-of-words</text>
  <text x="129" y="182" fill="#3ddc97" font-size="12" text-anchor="middle">bias-AUC 0.9061</text>
  <text x="129" y="199" fill="#97a1b2" font-size="11" text-anchor="middle">toxic recall ~0.448</text>

  <!-- arrow 1->2 -->
  <line x1="218" y1="166" x2="252" y2="166" stroke="#97a1b2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: RNN family (measured, green) -->
  <rect x="254" y="120" width="190" height="92" rx="10" fill="#161a23" stroke="#3ddc97" stroke-width="2"/>
  <text x="349" y="142" fill="#e8eaf0" font-size="13" font-weight="bold" text-anchor="middle">LSTM / BiLSTM /</text>
  <text x="349" y="159" fill="#e8eaf0" font-size="13" font-weight="bold" text-anchor="middle">BiGRU + Attn</text>
  <text x="349" y="179" fill="#3ddc97" font-size="12" text-anchor="middle">bias-AUC 0.8927</text>
  <text x="349" y="196" fill="#3ddc97" font-size="12" text-anchor="middle">-&gt; 0.9190</text>

  <!-- arrow 2->3 -->
  <line x1="444" y1="166" x2="478" y2="166" stroke="#97a1b2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: DistilBERT (measured, blue) -->
  <rect x="480" y="120" width="190" height="92" rx="10" fill="#161a23" stroke="#5b8cff" stroke-width="2"/>
  <text x="575" y="142" fill="#e8eaf0" font-size="13" font-weight="bold" text-anchor="middle">DistilBERT</text>
  <text x="575" y="159" fill="#97a1b2" font-size="11" text-anchor="middle">fine-tuned (6 layers)</text>
  <text x="575" y="179" fill="#5b8cff" font-size="12" text-anchor="middle">ROC-AUC 0.9515</text>
  <text x="575" y="196" fill="#5b8cff" font-size="12" text-anchor="middle">acc 0.8851</text>

  <!-- arrow 3->4 -->
  <line x1="670" y1="166" x2="704" y2="166" stroke="#97a1b2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4: Larger transformer (proposed, amber dashed) -->
  <rect x="706" y="120" width="186" height="92" rx="10" fill="#1d222e" stroke="#ffb454" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="799" y="142" fill="#e8eaf0" font-size="13" font-weight="bold" text-anchor="middle">Larger transformer</text>
  <text x="799" y="159" fill="#97a1b2" font-size="11" text-anchor="middle">BERT-large class</text>
  <text x="799" y="179" fill="#ffb454" font-size="12" text-anchor="middle">not run by us</text>
  <text x="799" y="196" fill="#97a1b2" font-size="11" text-anchor="middle">raises capacity ceiling</text>

  <!-- arrow 4->5 -->
  <line x1="892" y1="166" x2="926" y2="166" stroke="#97a1b2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 5: ENSEMBLE (proposed, amber dashed) -->
  <rect x="928" y="120" width="132" height="92" rx="10" fill="#1d222e" stroke="#ffb454" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="994" y="160" fill="#ffb454" font-size="15" font-weight="bold" text-anchor="middle">ENSEMBLE</text>
  <text x="994" y="183" fill="#97a1b2" font-size="11" text-anchor="middle">proposed</text>

  <!-- divider -->
  <line x1="40" y1="246" x2="1060" y2="246" stroke="#2c3340" stroke-width="1"/>

  <!-- ===================== BOTTOM: ensemble architecture ===================== -->
  <text x="40" y="278" fill="#97a1b2" font-size="13" font-weight="bold">ENSEMBLE ARCHITECTURE (simple average of three diverse base models)</text>

  <!-- input -->
  <rect x="40" y="380" width="120" height="56" rx="10" fill="#161a23" stroke="#2c3340" stroke-width="2"/>
  <text x="100" y="404" fill="#e8eaf0" font-size="13" font-weight="bold" text-anchor="middle">comment</text>
  <text x="100" y="422" fill="#97a1b2" font-size="11" text-anchor="middle">input text</text>

  <!-- Base model 1: RNN (measured, green) -->
  <rect x="220" y="300" width="200" height="64" rx="10" fill="#161a23" stroke="#3ddc97" stroke-width="2"/>
  <text x="320" y="325" fill="#e8eaf0" font-size="13" font-weight="bold" text-anchor="middle">RNN (BiGRU + Attn)</text>
  <text x="320" y="345" fill="#97a1b2" font-size="11" text-anchor="middle">measured single model</text>
  <text x="438" y="338" fill="#3ddc97" font-size="13" font-weight="bold" text-anchor="middle">p1</text>

  <!-- Base model 2: DistilBERT (measured, blue) -->
  <rect x="220" y="380" width="200" height="64" rx="10" fill="#161a23" stroke="#5b8cff" stroke-width="2"/>
  <text x="320" y="405" fill="#e8eaf0" font-size="13" font-weight="bold" text-anchor="middle">DistilBERT</text>
  <text x="320" y="425" fill="#97a1b2" font-size="11" text-anchor="middle">measured single model</text>
  <text x="438" y="418" fill="#5b8cff" font-size="13" font-weight="bold" text-anchor="middle">p2</text>

  <!-- Base model 3: Larger transformer (proposed, amber dashed) -->
  <rect x="220" y="460" width="200" height="64" rx="10" fill="#1d222e" stroke="#ffb454" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="320" y="485" fill="#e8eaf0" font-size="13" font-weight="bold" text-anchor="middle">Larger transformer</text>
  <text x="320" y="505" fill="#ffb454" font-size="11" text-anchor="middle">proposed, not run by us</text>
  <text x="438" y="498" fill="#ffb454" font-size="13" font-weight="bold" text-anchor="middle">p3</text>

  <!-- input -> three base models -->
  <path d="M160,400 L188,400 L188,332 L218,332" fill="none" stroke="#97a1b2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="160" y1="408" x2="218" y2="412" stroke="#97a1b2" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M160,418 L188,418 L188,492 L218,492" fill="none" stroke="#97a1b2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- p1,p2,p3 -> combiner -->
  <path d="M456,332 L490,332 L490,392 L518,392" fill="none" stroke="#97a1b2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="456" y1="412" x2="518" y2="412" stroke="#97a1b2" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M456,492 L490,492 L490,432 L518,432" fill="none" stroke="#97a1b2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- combiner (proposed, amber dashed) -->
  <rect x="520" y="372" width="216" height="80" rx="10" fill="#1d222e" stroke="#ffb454" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="628" y="398" fill="#e8eaf0" font-size="13" font-weight="bold" text-anchor="middle">Simple average</text>
  <text x="628" y="420" fill="#ffb454" font-size="14" font-weight="bold" text-anchor="middle">P = (p1 + p2 + p3) / 3</text>
  <text x="628" y="440" fill="#97a1b2" font-size="11" text-anchor="middle">equal-weight mean of probabilities</text>

  <!-- combiner -> P(toxic) -->
  <line x1="736" y1="412" x2="772" y2="412" stroke="#5b8cff" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- P(toxic) -->
  <rect x="774" y="384" width="118" height="56" rx="10" fill="#161a23" stroke="#5b8cff" stroke-width="2"/>
  <text x="833" y="409" fill="#e8eaf0" font-size="13" font-weight="bold" text-anchor="middle">P(toxic)</text>
  <text x="833" y="427" fill="#97a1b2" font-size="11" text-anchor="middle">[0, 1]</text>

  <!-- P(toxic) -> threshold -->
  <line x1="892" y1="412" x2="928" y2="412" stroke="#97a1b2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- threshold -> label -->
  <rect x="930" y="372" width="130" height="80" rx="10" fill="#161a23" stroke="#2c3340" stroke-width="2"/>
  <text x="995" y="396" fill="#e8eaf0" font-size="13" font-weight="bold" text-anchor="middle">threshold</text>
  <text x="995" y="414" fill="#97a1b2" font-size="11" text-anchor="middle">P &gt;= 0.5 ?</text>
  <text x="995" y="436" fill="#36d6c3" font-size="12" text-anchor="middle">label: toxic / not</text>

  <!-- combiner annotation: the key idea (violet, literature/ensemble idea) -->
  <rect x="520" y="478" width="540" height="100" rx="10" fill="#161a23" stroke="#b48cff" stroke-width="1.5"/>
  <text x="536" y="500" fill="#b48cff" font-size="12" font-weight="bold">Why average diverse models?</text>
  <text x="536" y="520" fill="#e8eaf0" font-size="12">Diverse architectures make different mistakes -&gt; low error correlation.</text>
  <text x="536" y="540" fill="#e8eaf0" font-size="12">With pairwise correlation rho and per-model variance sigma^2, the average has</text>
  <text x="536" y="560" fill="#e8eaf0" font-size="12">the same bias but variance:</text>
  <text x="536" y="571" fill="#b48cff" font-size="13" font-weight="bold">  Var(avg) = rho*sigma^2 + (1 - rho)*sigma^2 / K</text>

  <!-- supporting note: source of the idea (violet) -->
  <rect x="40" y="560" width="450" height="100" rx="10" fill="#161a23" stroke="#b48cff" stroke-width="1.5"/>
  <text x="56" y="582" fill="#b48cff" font-size="12" font-weight="bold">Where this comes from</text>
  <text x="56" y="602" fill="#e8eaf0" font-size="12">Kaggle 8th place (Qishen Ha, 2019): four diverse models</text>
  <text x="56" y="620" fill="#e8eaf0" font-size="12">combined by simple averaging of probabilities.</text>
  <text x="56" y="640" fill="#97a1b2" font-size="11">Ensemble theory: Krogh and Vedelsby, 1995. We have RNN</text>
  <text x="56" y="656" fill="#97a1b2" font-size="11">family + DistilBERT already; ensemble itself is proposed.</text>

  <!-- ===================== legend ===================== -->
  <rect x="520" y="592" width="540" height="68" rx="10" fill="#161a23" stroke="#2c3340" stroke-width="1.5"/>
  <text x="536" y="613" fill="#97a1b2" font-size="12" font-weight="bold">Legend</text>

  <rect x="536" y="624" width="26" height="16" rx="4" fill="#161a23" stroke="#3ddc97" stroke-width="2"/>
  <text x="570" y="637" fill="#e8eaf0" font-size="12">solid green = measured by us</text>

  <rect x="536" y="644" width="26" height="16" rx="4" fill="#1d222e" stroke="#ffb454" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="570" y="657" fill="#e8eaf0" font-size="12">dashed amber = proposed next step</text>

  <rect x="822" y="624" width="26" height="16" rx="4" fill="#161a23" stroke="#5b8cff" stroke-width="2"/>
  <text x="856" y="637" fill="#e8eaf0" font-size="12">solid blue = transformer (measured)</text>

  <rect x="822" y="644" width="26" height="16" rx="4" fill="#161a23" stroke="#b48cff" stroke-width="2"/>
  <text x="856" y="657" fill="#e8eaf0" font-size="12">violet = literature / ensemble idea</text>
</svg>
