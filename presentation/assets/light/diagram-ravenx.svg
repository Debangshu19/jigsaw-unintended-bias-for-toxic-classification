<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1020" viewBox="0 0 820 1020" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6473"/>
    </marker>
    <marker id="arrowV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a3fc0"/>
    </marker>
  </defs>

  <!-- page bg -->
  <rect x="0" y="0" width="820" height="1020" fill="#ffffff"/>

  <!-- title -->
  <text x="410" y="38" text-anchor="middle" fill="#1b1f27" font-size="23" font-weight="bold">RAVEN-X architecture</text>
  <text x="410" y="60" text-anchor="middle" fill="#5a6473" font-size="13">One shared encoder, two heads. Cross-script rationale transfer for Hindi.</text>

  <!-- 1) mixed batch -->
  <rect x="120" y="80" width="580" height="56" rx="10" fill="#f6f8fc" stroke="#ccd4e0"/>
  <text x="410" y="106" text-anchor="middle" fill="#1b1f27" font-size="14" font-weight="bold">MIXED BATCH (16)</text>
  <text x="410" y="124" text-anchor="middle" fill="#5a6473" font-size="12.5">8 HASOC-Hindi (Devanagari) + 8 HateXplain-English (Latin)</text>

  <line x1="410" y1="136" x2="410" y2="160" stroke="#5a6473" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 2) tokenizer -->
  <rect x="160" y="160" width="500" height="50" rx="10" fill="#f6f8fc" stroke="#ccd4e0"/>
  <text x="410" y="182" text-anchor="middle" fill="#1b1f27" font-size="14" font-weight="bold">One MuRIL tokenizer + unified preprocessing</text>
  <text x="410" y="200" text-anchor="middle" fill="#5a6473" font-size="12">max_len 128</text>

  <line x1="410" y1="210" x2="410" y2="234" stroke="#5a6473" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 3) shared encoder (central blue) -->
  <rect x="120" y="234" width="580" height="96" rx="12" fill="#e9edf5" stroke="#2f5fe0" stroke-width="2.2"/>
  <text x="410" y="262" text-anchor="middle" fill="#2f5fe0" font-size="16" font-weight="bold">SHARED ENCODER = MuRIL-base</text>
  <text x="410" y="284" text-anchor="middle" fill="#1b1f27" font-size="13">12 layers, 768-d, ~236M params</text>
  <text x="410" y="304" text-anchor="middle" fill="#5a6473" font-size="12.5">the only cross-language channel</text>
  <text x="410" y="322" text-anchor="middle" fill="#5a6473" font-size="11.5">Devanagari slur and English equivalent share zero subword tokens — transfer is representational</text>

  <!-- split: two arrows -->
  <path d="M410,330 L410,348 L250,348 L250,372" fill="none" stroke="#5a6473" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M410,330 L410,348 L570,348 L570,372" fill="none" stroke="#5a6473" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- LEFT branch label: per-word vectors -->
  <rect x="120" y="372" width="260" height="42" rx="9" fill="#f6f8fc" stroke="#ccd4e0"/>
  <text x="250" y="398" text-anchor="middle" fill="#1b1f27" font-size="13">per-word vectors</text>

  <!-- RIGHT branch label: sentence vector -->
  <rect x="440" y="372" width="260" height="42" rx="9" fill="#f6f8fc" stroke="#ccd4e0"/>
  <text x="570" y="398" text-anchor="middle" fill="#1b1f27" font-size="13">sentence vector ([CLS])</text>

  <line x1="250" y1="414" x2="250" y2="436" stroke="#5a6473" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="570" y1="414" x2="570" y2="436" stroke="#5a6473" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- LEFT: HEAD 2 RATIONALE (violet novelty) -->
  <rect x="100" y="436" width="300" height="104" rx="12" fill="#e9edf5" stroke="#6a3fc0" stroke-width="2.2"/>
  <text x="250" y="460" text-anchor="middle" fill="#6a3fc0" font-size="14.5" font-weight="bold">HEAD 2: RATIONALE</text>
  <text x="250" y="480" text-anchor="middle" fill="#1b1f27" font-size="12.5">which words are toxic</text>
  <text x="250" y="498" text-anchor="middle" fill="#1b1f27" font-size="12.5">768 -&gt; 256 -&gt; 1 per word</text>
  <text x="250" y="518" text-anchor="middle" fill="#5a6473" font-size="12">English-supervised ONLY</text>
  <text x="250" y="534" text-anchor="middle" fill="#6a3fc0" font-size="11" font-weight="bold">the novelty</text>

  <!-- RIGHT: HEAD 1 CLASSIFY -->
  <rect x="420" y="436" width="300" height="104" rx="12" fill="#e9edf5" stroke="#2f5fe0" stroke-width="2"/>
  <text x="570" y="460" text-anchor="middle" fill="#2f5fe0" font-size="14.5" font-weight="bold">HEAD 1: CLASSIFY</text>
  <text x="570" y="480" text-anchor="middle" fill="#1b1f27" font-size="12.5">toxic / not</text>
  <text x="570" y="498" text-anchor="middle" fill="#1b1f27" font-size="12.5">Hindi + English</text>

  <!-- novelty note -->
  <rect x="100" y="552" width="300" height="44" rx="9" fill="#f6f8fc" stroke="#6a3fc0" stroke-width="1.2"/>
  <text x="250" y="571" text-anchor="middle" fill="#6a3fc0" font-size="11">English rationale labels -&gt; faithful Hindi</text>
  <text x="250" y="587" text-anchor="middle" fill="#6a3fc0" font-size="11">highlights, with zero Hindi rationale labels</text>

  <!-- arrows from heads into loss -->
  <path d="M250,596 L250,624 L360,624 L360,646" fill="none" stroke="#6a3fc0" stroke-width="1.6" marker-end="url(#arrowV)"/>
  <path d="M570,540 L570,624 L460,624 L460,646" fill="none" stroke="#5a6473" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 5) per-head-masked loss -->
  <rect x="100" y="646" width="620" height="138" rx="12" fill="#f6f8fc" stroke="#ccd4e0"/>
  <text x="410" y="672" text-anchor="middle" fill="#1b1f27" font-size="15" font-weight="bold">PER-HEAD-MASKED LOSS</text>
  <text x="410" y="690" text-anchor="middle" fill="#5a6473" font-size="11.5">each term applies only where its label exists — never trains on a missing label</text>
  <text x="410" y="714" text-anchor="middle" fill="#0e9266" font-size="12.5">L_z (toxic, both languages)</text>
  <text x="410" y="734" text-anchor="middle" fill="#6a3fc0" font-size="12.5">L_rat (words, English only)</text>
  <text x="410" y="754" text-anchor="middle" fill="#0e9b8c" font-size="12.5">L_faith = comp + suff (Hindi, label-free)</text>

  <line x1="410" y1="784" x2="410" y2="808" stroke="#5a6473" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 6) serving -->
  <rect x="120" y="808" width="580" height="74" rx="12" fill="#e9edf5" stroke="#0e9266" stroke-width="2"/>
  <text x="410" y="834" text-anchor="middle" fill="#0e9266" font-size="15" font-weight="bold">SERVING</text>
  <text x="410" y="854" text-anchor="middle" fill="#1b1f27" font-size="12.5">one forward pass = label + highlighted words</text>
  <text x="410" y="872" text-anchor="middle" fill="#5a6473" font-size="12">(Raven API)</text>

  <!-- measured results panel -->
  <rect x="120" y="902" width="580" height="98" rx="12" fill="#f6f8fc" stroke="#ccd4e0"/>
  <text x="138" y="924" fill="#1b1f27" font-size="12.5" font-weight="bold">Measured (first run, Colab T4, --fast, 3 epochs, seed 42)</text>
  <text x="138" y="944" fill="#0e9266" font-size="12">MuRIL classify macro-F1 0.842 val (epoch 2)</text>
  <text x="138" y="962" fill="#5a6473" font-size="11.5">vs TF-IDF+LogReg 0.787 val / 0.813 test  (+5.5 pts on same val split)</text>
  <text x="138" y="982" fill="#6a3fc0" font-size="12">English rationale token-F1 0.653 -&gt; 0.679</text>
  <text x="558" y="982" fill="#a96a09" font-size="11">Hindi transfer: not measured</text>
</svg>
