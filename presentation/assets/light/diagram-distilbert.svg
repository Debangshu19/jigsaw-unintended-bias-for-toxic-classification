<svg id="fig-distilbert" xmlns="http://www.w3.org/2000/svg" width="760" height="1040" viewBox="0 0 760 1040" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#2f5fe0"/>
    </marker>
    <marker id="arrowMute" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#5a6473"/>
    </marker>
  </defs>

  <!-- page background -->
  <rect x="0" y="0" width="760" height="1040" fill="#ffffff"/>

  <!-- title -->
  <text x="32" y="42" fill="#1b1f27" font-size="23" font-weight="bold">DistilBERT for sequence classification</text>
  <text x="32" y="66" fill="#5a6473" font-size="13">Top-to-bottom data flow. Parameter counts are shown on the right of each block.</text>

  <!-- ============ MAIN COLUMN (x ~ 32..420) ============ -->

  <!-- 1) Input text -->
  <rect x="32" y="88" width="388" height="52" rx="10" fill="#f6f8fc" stroke="#ccd4e0"/>
  <text x="50" y="113" fill="#1b1f27" font-size="14" font-weight="bold">1. Input comment text</text>
  <text x="50" y="131" fill="#5a6473" font-size="12">one comment string</text>
  <line x1="226" y1="140" x2="226" y2="160" stroke="#5a6473" stroke-width="1.5" marker-end="url(#arrowMute)"/>

  <!-- 2) Tokenizer -->
  <rect x="32" y="162" width="388" height="64" rx="10" fill="#f6f8fc" stroke="#ccd4e0"/>
  <text x="50" y="186" fill="#1b1f27" font-size="14" font-weight="bold">2. WordPiece tokenizer</text>
  <text x="50" y="204" fill="#5a6473" font-size="12">30,522 vocab &#183; max_len 128</text>
  <text x="50" y="220" fill="#5a6473" font-size="12">output: input_ids + attention_mask</text>
  <line x1="226" y1="226" x2="226" y2="246" stroke="#5a6473" stroke-width="1.5" marker-end="url(#arrowMute)"/>

  <!-- 3) Embeddings (blue) -->
  <rect x="32" y="248" width="388" height="78" rx="10" fill="#f6f8fc" stroke="#2f5fe0" stroke-width="1.6"/>
  <text x="50" y="272" fill="#2f5fe0" font-size="14" font-weight="bold">3. Embeddings</text>
  <text x="50" y="290" fill="#1b1f27" font-size="12">word (30522 &#215; 768) + positional (512 &#215; 768)</text>
  <text x="50" y="307" fill="#1b1f27" font-size="12">+ LayerNorm</text>
  <text x="50" y="322" fill="#5a6473" font-size="11">sequence of 768-d vectors</text>
  <text x="404" y="290" fill="#2f5fe0" font-size="12" font-weight="bold" text-anchor="end">~23.8M params</text>
  <line x1="226" y1="326" x2="226" y2="346" stroke="#2f5fe0" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 4) Transformer stack (blue) -->
  <rect x="32" y="348" width="388" height="96" rx="10" fill="#e9edf5" stroke="#2f5fe0" stroke-width="1.6"/>
  <text x="50" y="374" fill="#2f5fe0" font-size="15" font-weight="bold">4. 6 &#215; Transformer block</text>
  <text x="50" y="394" fill="#1b1f27" font-size="12">stacked encoder layers (no decoder)</text>
  <text x="50" y="411" fill="#1b1f27" font-size="12">768 hidden &#183; 12 attention heads</text>
  <text x="50" y="428" fill="#5a6473" font-size="11">see one block expanded on the right</text>
  <text x="404" y="374" fill="#2f5fe0" font-size="12" font-weight="bold" text-anchor="end">~42.5M params</text>

  <!-- dashed connector from stack to callout -->
  <path d="M420,396 L468,396" stroke="#2f5fe0" stroke-width="1.4" stroke-dasharray="4 4" fill="none"/>

  <line x1="226" y1="444" x2="226" y2="468" stroke="#2f5fe0" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 5) CLS token -->
  <rect x="32" y="470" width="388" height="58" rx="10" fill="#f6f8fc" stroke="#ccd4e0"/>
  <text x="50" y="494" fill="#1b1f27" font-size="14" font-weight="bold">5. Take first-token [CLS] hidden state</text>
  <text x="50" y="514" fill="#5a6473" font-size="12">one 768-d vector for the whole comment</text>
  <line x1="226" y1="528" x2="226" y2="548" stroke="#5a6473" stroke-width="1.5" marker-end="url(#arrowMute)"/>

  <!-- 6) pre_classifier -->
  <rect x="32" y="550" width="388" height="72" rx="10" fill="#f6f8fc" stroke="#ccd4e0"/>
  <text x="50" y="574" fill="#1b1f27" font-size="14" font-weight="bold">6. pre_classifier</text>
  <text x="50" y="592" fill="#1b1f27" font-size="12">Linear(768 &#8594; 768) + ReLU</text>
  <text x="50" y="609" fill="#1b1f27" font-size="12">+ Dropout(0.2)</text>
  <text x="404" y="574" fill="#5a6473" font-size="12" font-weight="bold" text-anchor="end">~0.59M params</text>
  <line x1="226" y1="622" x2="226" y2="642" stroke="#5a6473" stroke-width="1.5" marker-end="url(#arrowMute)"/>

  <!-- 7) classifier -->
  <rect x="32" y="644" width="388" height="62" rx="10" fill="#f6f8fc" stroke="#ccd4e0"/>
  <text x="50" y="668" fill="#1b1f27" font-size="14" font-weight="bold">7. classifier</text>
  <text x="50" y="688" fill="#1b1f27" font-size="12">Linear(768 &#8594; 2) &#8594; 2 logits</text>
  <text x="404" y="668" fill="#5a6473" font-size="12" font-weight="bold" text-anchor="end">~1.5K params</text>
  <line x1="226" y1="706" x2="226" y2="726" stroke="#5a6473" stroke-width="1.5" marker-end="url(#arrowMute)"/>

  <!-- 8) softmax / decision (green accent for output) -->
  <rect x="32" y="728" width="388" height="92" rx="10" fill="#f6f8fc" stroke="#0e9266" stroke-width="1.6"/>
  <text x="50" y="752" fill="#0e9266" font-size="14" font-weight="bold">8. softmax &#8594; decision</text>
  <text x="50" y="772" fill="#1b1f27" font-size="12">softmax over 2 logits &#8594; P(toxic)</text>
  <text x="50" y="789" fill="#1b1f27" font-size="12">threshold 0.5</text>
  <text x="50" y="809" fill="#1b1f27" font-size="12">label: P &#8805; 0.5 &#8594; review &#160;&#160;|&#160;&#160; else safe</text>

  <!-- ============ CALLOUT: one transformer block (right side) ============ -->
  <rect x="470" y="300" width="266" height="320" rx="12" fill="#e9edf5" stroke="#2f5fe0" stroke-width="1.6"/>
  <text x="486" y="326" fill="#2f5fe0" font-size="14" font-weight="bold">Inside one Transformer block</text>
  <text x="486" y="344" fill="#5a6473" font-size="11">(all 6 blocks are identical)</text>

  <!-- sub: MHSA -->
  <rect x="486" y="356" width="234" height="44" rx="8" fill="#f6f8fc" stroke="#2f5fe0"/>
  <text x="603" y="378" fill="#1b1f27" font-size="12.5" font-weight="bold" text-anchor="middle">Multi-Head Self-Attention</text>
  <text x="603" y="394" fill="#5a6473" font-size="11" text-anchor="middle">12 heads</text>
  <line x1="603" y1="400" x2="603" y2="418" stroke="#2f5fe0" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- sub: Add & Norm -->
  <rect x="486" y="420" width="234" height="34" rx="8" fill="#f6f8fc" stroke="#ccd4e0"/>
  <text x="603" y="442" fill="#1b1f27" font-size="12.5" text-anchor="middle">Add &amp; Norm (residual + LayerNorm)</text>
  <line x1="603" y1="454" x2="603" y2="472" stroke="#2f5fe0" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- sub: FFN -->
  <rect x="486" y="474" width="234" height="52" rx="8" fill="#f6f8fc" stroke="#2f5fe0"/>
  <text x="603" y="496" fill="#1b1f27" font-size="12.5" font-weight="bold" text-anchor="middle">Feed-Forward</text>
  <text x="603" y="513" fill="#5a6473" font-size="11" text-anchor="middle">768 &#8594; 3072 &#8594; 768, GELU</text>
  <line x1="603" y1="526" x2="603" y2="544" stroke="#2f5fe0" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- sub: Add & Norm 2 -->
  <rect x="486" y="546" width="234" height="34" rx="8" fill="#f6f8fc" stroke="#ccd4e0"/>
  <text x="603" y="568" fill="#1b1f27" font-size="12.5" text-anchor="middle">Add &amp; Norm (residual + LayerNorm)</text>

  <text x="486" y="602" fill="#5a6473" font-size="11">Output feeds the next block.</text>

  <!-- ============ footer ============ -->
  <rect x="32" y="852" width="704" height="56" rx="10" fill="#e9edf5" stroke="#ccd4e0"/>
  <text x="50" y="877" fill="#2f5fe0" font-size="14" font-weight="bold">~66.96M params total</text>
  <text x="50" y="897" fill="#1b1f27" font-size="12.5">6 layers &#183; 768 hidden &#183; 12 heads</text>
  <text x="718" y="877" fill="#5a6473" font-size="11.5" text-anchor="end">backbone: distilbert-base-uncased</text>
  <text x="718" y="897" fill="#5a6473" font-size="11.5" text-anchor="end">head: DistilBertForSequenceClassification, num_labels=2</text>

  <!-- legend -->
  <rect x="32" y="924" width="704" height="84" rx="10" fill="#f6f8fc" stroke="#ccd4e0"/>
  <text x="50" y="948" fill="#5a6473" font-size="12" font-weight="bold">Legend</text>
  <rect x="50" y="958" width="14" height="14" rx="3" fill="#2f5fe0"/>
  <text x="72" y="970" fill="#1b1f27" font-size="12">transformer / main path</text>
  <rect x="270" y="958" width="14" height="14" rx="3" fill="#0e9266"/>
  <text x="292" y="970" fill="#1b1f27" font-size="12">decision output</text>
  <text x="50" y="994" fill="#5a6473" font-size="11.5">Counts are from the model architecture in FACTS &#167;3. They are an architectural breakdown, not a separately measured result.</text>
</svg>
